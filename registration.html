<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="registration1.css">
    
    <title>Registration</title>
</head>
<body>
     <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Pet Salon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="services.html" >Services</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link active" href="registration.html" >
                            Registration
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>
<div class="container mt-4">
    <h1>Registration</h1>

    <form class="m-4 border p-4 bg-light rounded">
            <div class="mb-3">
                <label for="petName" class="form-label">Pet Name</label>
                <input type="text" class="form-control" id="petName" placeholder="Enter pet name">
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input class="form-control" type="number" placeholder="Enter pet age" step="any">
            </div>

            <div class="mb-3">
                <label class="form-label">Breed</label>
                <input class="form-control" type="text" placeholder="Enter pet breed">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <input class="form-control" type="text" placeholder="Enter pet gender">
            </div>

            <div class="mb-3">
                <label class="form-label">Service</label>
                <select class="form-control">
                    <option value="">Select a service</option>
                    <option value="grooming">Grooming</option>
                    <option value="vaccination">Vaccination</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-3">
                <button class="btn btn-primary" type="submit">Register</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>

        </form>   
<section class="m-5">
        <h2>Registered Pets</h2>
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th >Pet Name</th>
                    <th >Age</th>
                    <th >Breed</th>
                    <th >Gender</th>
                    <th >Service</th>
                    <th >Delete</th>
                </tr>
            </thead>

            <tbody id="petsTable">
                <!-- Registered pets will be added here dynamically -->
            
            </tbody>

        </table>
    
</div>

    <script src="scripts/registration1.js"></script>
</body>

</html>
