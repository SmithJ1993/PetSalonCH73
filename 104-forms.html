<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <title>Document</title>
</head>
<body>
    
    <section class="m-5">
        <h1>Register Products</h1>

        <!-- Form for registering products -->
        <form class="m-4 border p-4 bg-light rounded">
            <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input id="productName" type="text" class="form-control" placeholder="Enter product name">
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control" id="productPrice" type="number" placeholder="$1.00" step="any">
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-control" id="productCategory">
                    <option value="">Select a category</option>
                    <option value="vegetable">Vegetable</option>
                    <option value="fruit">Fruit</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-3">
                <button onclick="registerProduct(event)" class="btn btn-primary" type="submit">Register</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>

        </form>   

    </section>

    <section class="m-5">
        <h1>Registered Products</h1>

        <table class="table mt-4">
            <thead>
                <tr>
                    <th >Product Name</th>
                    <th >Price</th>
                    <th >Category</th>
                </tr>
            </thead>
            <tbody id="Body">
                <!-- Registered products will be displayed here -->
            </tbody>
        </table>

<script src="scripts/104-forms.js"></script>
</body>
</html>
